<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Element Font Size</title>
  <style>
    :root {
      font-size: 100%;
    }

    body {
      font: -apple-system-body, sans-serif;
    }

    main,
    section,
    header,
    div {
      font-size: inherit;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <header>Heading content 1</header>
      <section>
        <div>
          <p>Paragraph content 1</p>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
