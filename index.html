<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="viewport" content="width=device-width, shrink-to-fit=no, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>UIP Registration | Registration Status</title>
  <link rel="stylesheet" href="_global/xlib/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="_global/xlib/unisys/unisys-style.min.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/app-style.css">
  <link rel="stylesheet" href="css/uipStyle.css">
  <link rel="shortcut icon" href="_global/favicon.ico" type="image/x-icon">
</head>
<body>
  <main class="d-grid">
    <!-- Header -->
    <header class="header h-auto d-flex bg-white">
      <h1 class="logo fs-0 m-0">Unisys Innovation Program</h1>
    </header>
    <article class="content d-grid position-relative reg__status">
      <section class="status__bg d-flex justify-content-center">
        <img src="css/images/icons/reg__success.svg" alt="Registration Success" class="img-fluid">
      </section>
      <section class="status__msg d-flex flex-column">
        <strong>Registration Successful!</strong>
        <span>You are successfully registered for the program</span>
      </section>
      <section class="status__qr">
        <img src="css/images/icons/status_qr.svg" alt="Status Qr" class="img-fluid">
      </section>
    </article>
  </main>
</body>
</html>
