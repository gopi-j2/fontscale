<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Element Font Size</title>
  <style>
    :root {
      font-size: 100%;
    }

    body {
      font-size: 1rem;
      line-height: 1.6;
      padding: 1rem;
      transition: font-size 0.3s ease;
    }

    h1 {
      font-size: 2rem;
    }

    p {
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <h1>Verify Element Font Size</h1>
  <p>This text should adjust according to your preferred reading size and other accessibility settings.</p>
  <p id="font-size-display"></p>
  <script>
    // Function to get and display the font size of an element
    function displayElementFontSize(element) {
      // Get the computed font size of the specified element
      const fontSize = getComputedStyle(element).fontSize

      // Display the font size in the paragraph
      const fontSizeDisplay = document.getElementById('font-size-display')
      fontSizeDisplay.textContent = `Font size of <${element.tagName.toLowerCase()}> element: ${fontSize}`
    }

    // Run the displayElementFontSize function on page load
    window.onload = () => {
      const element = document.querySelector('h1') // Specify the element you want to check
      displayElementFontSize(element)
    };
  </script>
</body>
</html>
