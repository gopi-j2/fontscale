<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>a11y</title>
  <link rel="stylesheet" href="styles/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <main>
    <!-- Button trigger modal -->
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#cancelVerification">Close Scan</button>
    <div class="modal fade" id="cancelVerification" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="cancelVerificationLabel" aria-hidden="true">
      <div class="modal-dialog custom-modal modal-dialog-centered modal-md">
        <div class="modal-content">
          <div class="modal-body">
            <span class="icon alert-icon"></span>
            <p id="cancelVerificationLabel" class="cancel-message">Are you sure you want to cancel Verification ?</p>
          </div>
          <div class="modal-footer flex-row-reverse">
            <button type="button" id="no" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
            <button type="button" id="yes" class="btn btn-primary ms-3">Yes</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
