<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="viewport" content="width=device-width, shrink-to-fit=no, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>UIP Registration | Personal Details</title>
  <link rel="stylesheet" href="_global/xlib/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="_global/xlib/unisys/unisys-style.min.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/app-style.css">
  <link rel="stylesheet" href="css/uipStyle.css">
  <link rel="shortcut icon" href="_global/favicon.ico" type="image/x-icon">
</head>
<body>
  <main class="d-grid">
    <!-- Header -->
    <header class="header h-auto d-flex bg-white">
      <h1 class="logo fs-0 m-0">Unisys Innovation Program</h1>
    </header>
    <article class="content d-grid user__details">
      <header class="content__header d-flex flex-column gap-2 justify-content-center">
        <h2 class="content__title">Personal Details</h2>
        <strong class="content__description">Please Provide your basic details</strong>
      </header>
      <img src="css/images/icons/personal_details.svg" alt="Personal Details" class="img-fluid content__thumbnail mb-3">
      <form class="pd__form form-outline d-grid" autocomplete="off">
        <div class="col fieldset">
          <label for="firstName">First Name</label>
          <input type="text" name="firstName" id="firstName" class="form-control" placeholder="Enter first name">
        </div>
        <div class="col fieldset">
          <label for="lastName">Last Name</label>
          <input type="text" name="lastName" id="lastName" class="form-control" placeholder="Enter last name">
        </div>
        <div class="col fieldset">
          <label for="email">Email</label>
          <input type="email" name="email" id="email" class="form-control" placeholder="Enter email">
        </div>
        <div class="col fieldset">
          <label for="mobileNumber">Mobile Number</label>
          <div class="d-inline-flex align-items-center gap-3">
            <select name="telExtension" id="telExtension" class="form-select sm">
              <option value="+91" selected>+91</option>
              <option value="+01">+01</option>
              <option value="+02">+02</option>
              <option value="+03">+03</option>
            </select>
            <input type="tel" name="mobileNumber" id="mobileNumber" class="form-control" placeholder="Enter mobile number">
          </div>
        </div>
        <div class="col fieldset">
          <label for="gender">Gender</label>
          <div class="d-flex align-items-center gap-3">
            <div class="d-inline-flex">
              <input type="radio" class="btn-check" name="genderType" id="maleGender" autocomplete="off" checked>
              <label class="btn btn__radio m-0" for="maleGender">Male</label>
            </div>
            <div class="d-inline-flex">
              <input type="radio" class="btn-check" name="genderType" id="femaleGender" autocomplete="off">
              <label class="btn btn__radio m-0" for="femaleGender">Female</label>
            </div>
            <div class="d-inline-flex">
              <input type="radio" class="btn-check" name="genderType" id="otherGender" autocomplete="off">
              <label class="btn btn__radio m-0" for="otherGender">Others</label>
            </div>
          </div>
        </div>
      </form>
    </article>
    <!-- Footer -->
    <footer class="d-flex justify-content-between align-items-center px-4">
      <button type="button" class="btn btn-secondary" id="btnCancel">Cancel</button>
      <button type="button" class="btn btn-primary m-0" id="btnSubmit">Next</button>
    </footer>
  </main>
</body>
